    label: Sprache
    browserControlled: Die Sprache richtet sich nach den Browsereinstellungen.
welcome:
  intro:
    title: Danke für die Installation von
    description: >-
      Erstelle QR-Codes offline – ohne Tracking und ohne Analysen. Standardmäßig
      bleibt alles auf deinem Gerät.
    benefits:
      instantQr: Klicke auf das Symbol in der Symbolleiste, um sofort einen QR-Code für den aktuellen Tab zu erhalten
      contextMenu: Klicke mit der rechten Maustaste auf einen Link oder eine Auswahl → QR-Code erstellen
      customization: Passe Farben, Logo und Punktstil an
  urlHandling:
    title: URL-Verarbeitung
    description: Lege fest, wie URLs vor der QR-Codierung aufbereitet werden.
    fields:
      tracking:
        label: Tracking-Parameter entfernen
        description: Entfernt utm_, fbclid, gclid usw.
      shortener:
        label: URL-Verkürzer
        externalDescription: Ein externer Dienst erhält die URL. Er wird nur verwendet, wenn du ihn auswählst.
        options:
          none:
            label: Keiner
            description: Es verlässt keine Anfrage deinen Browser.
          hamr:
            label: hamr (lokal, empfohlen)
            description: Lokale Komprimierung, es werden keine Daten an einen Server gesendet.
          tinyurl:
            label: TinyURL
          isgd:
            label: is.gd
          bitly:
            label: Bitly (API-Schlüssel erforderlich)
            apiKeyPlaceholder: Bitly-API-Schlüssel
            apiKeyRequired: Für Bitly ist ein API-Schlüssel erforderlich
    autoSaveDescription: Einstellungen werden automatisch gespeichert. Du kannst sie jederzeit unter „Einstellungen“ ändern.
    permissionDenied: Die Berechtigung für {host} wurde verweigert. Der URL-Verkürzer verwendet stattdessen die ursprüngliche URL.
  features:
    title: Funktionen
    favicon:
      label: Symbol des aktuellen Tabs als QR-Logo verwenden
      description: >-
        Standardmäßig aktiviert. Es werden weder zusätzliche Berechtigungen noch
        externe Favicon-Dienste benötigt.
    style:
      label: Stil
      description: 6 Punktformen, Farben, Logo, SVG/PNG/WebP/JPG
    performance:
      label: Schnell und offline
      description: Sofort verfügbares Popup, Kontextmenü, kein Server.
    completionMessage: >-
      Das war's! Du kannst QR Code Buddy jetzt verwenden. Klicke auf „Fertig“,
      um dieses Fenster zu schließen und QR-Codes zu erstellen.
